services:
  speech:
    image: homelab/artifact-pocket:3.1.0-cache-queue-20260913
    build: .
    restart: unless-stopped
    ports:
      - "${TTS_BIND_HOST:?Set the private bind address}:8790:8788"
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TOKEN_FILE: /run/secrets/tts_token
      POCKET_TTS_QUANTIZE: "${POCKET_TTS_QUANTIZE:-0}"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    secrets: [tts_token]
    volumes:
      - ./models:/models
      - ./cache:/cache
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "2.0"
    mem_limit: 3g
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 300s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  default:
    external: true
    name: artifact-tts-trial_default
secrets:
  tts_token:
    file: ./tts-token
