# cargo-deny policy for the server, preview-renderer and browser-tests workspaces.
# CI runs `cargo deny --manifest-path <workspace>/Cargo.toml --workspace --config deny.toml
# check advisories bans licenses sources` against each one
# (.github/workflows/dependencies.yml).

[graph]
# The targets we build and ship: CI and local builds (gnu) and the release binaries (musl).
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = true

[advisories]
# A yanked crate fails the check too: chacha20 0.10.1 was yanked for using an SSE4.1
# instruction in its SSE2 backend.
yanked = "deny"
# Every exception names the advisory, the crate that pulls it in, and why the server is not
# exposed or why it cannot be fixed yet. Remove an entry as soon as a usable fix exists;
# cargo-deny warns about entries that no longer match anything.
ignore = [
    # basic-toml is unmaintained. Only askama_derive uses it, at compile time, to read askama's
    # optional config file. It never sees runtime input.
    { id = "RUSTSEC-2026-0374", reason = "build-time only: askama_derive config parsing" },

    # zstd-safe 7.x memory-safety advisories, fixed in zstd-safe 8.2, which twilight-gateway
    # 0.17 does not accept. twilight-gateway enables zstd-safe with default features off, so
    # the `legacy` and `seekable` features are not compiled, and it only calls
    # DCtx::create/reset and DCtx::decompress_stream with InBuffer::around/OutBuffer::around.
    { id = "RUSTSEC-2026-0398", reason = "Seekable::decompress: seekable feature is off" },
    { id = "RUSTSEC-2026-0403", reason = "legacy feature is off, so legacy frames are rejected" },
]

[licenses]
# Permissive licences only. A crate whose licence expression does not resolve to one of these
# fails the check, so a new copyleft or unlicensed dependency is a deliberate decision.
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# One allowlist serves three lockfiles, so a licence can be absent from one of them.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false`; their licence is the repository's.
ignore = true

[bans]
# Duplicate versions come from upstream (for example rand 0.8 through rsa next to rand 0.10);
# report them without failing.
multiple-versions = "warn"
# A `*` version requirement fails. Path dependencies between private workspace crates (including
# the server's `test-util` self dev-dependency) carry no version and are allowed.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io. A dependency from another registry or a git URL fails the check.
unknown-registry = "deny"
unknown-git = "deny"
