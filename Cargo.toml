[package]
name = "artifact-mcp"
version = "1.29.3"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "artifact_mcp"
path = "src/lib.rs"

[[bin]]
name = "artifact-mcp"
path = "src/main.rs"

[features]
# Deterministic fakes (`FixedClock`, `SequentialIdSource`, `SeededRandom`, `ScriptedRandom`,
# `Testkit`) for tests. The self dev-dependency below turns it on for every test target, so
# release builds never compile them.
test-util = []

[dependencies]
aes-gcm = "0.11"
askama = "0.16"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.4"
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
hmac = "0.13"
hkdf = "0.13"
hex = "0.4"
# aws-lc backend: the same library rustls already uses. The rust_crypto backend still pulls rsa 0.9
# and p256 0.13 (RUSTSEC-2023-0071, RUSTSEC-2026-0387).
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
ipnet = "2"
nanoid = "0.5"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "std"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier", "zstd"] }
twilight-model = "0.17.1"
url = "2"

[dev-dependencies]
artifact-mcp = { path = ".", features = ["test-util"] }
# In-process TLS fixture for the JWKS transport tests; pinned to the version reqwest already locks.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs"] }

[profile.release]
panic = "abort"

# The root package stays the default member, so `cargo build`, `cargo test`, and the Docker build
# at the repository root still build only the server. `xtask/` holds `cargo xtask` maintenance
# commands and is built only when selected (`cargo xtask ...`, `--package xtask`, `--workspace`).
[workspace]
members = [".", "xtask"]
