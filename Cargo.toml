[package]
name = "artifact-mcp"
version = "1.7.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "artifact_mcp"
path = "src/lib.rs"

[[bin]]
name = "artifact-mcp"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
askama = "0.16"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
getrandom = "0.4"
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
hmac = "0.12"
hex = "0.4"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
ipnet = "2"
nanoid = "0.4"
r2d2 = "0.8"
r2d2_sqlite = "0.34"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier", "zstd"] }
twilight-model = "0.17.1"
url = "2"

[profile.release]
panic = "abort"
