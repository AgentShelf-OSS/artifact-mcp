#
# The preview renderer is a separate, network-isolated service. This crate is deliberately NOT a
# member of the root workspace: the empty `[workspace]` table below makes this directory its own
# workspace root, with its own Cargo.lock, so the server build never compiles it and the
# `./preview-renderer` Docker build context is self-contained.
[package]
name = "artifact-preview"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Network-isolated HTML-to-PNG preview renderer driving chrome-headless-shell over a DevTools pipe"

[[bin]]
name = "artifact-preview"
path = "src/main.rs"

[lib]
name = "artifact_preview"
path = "src/lib.rs"

[workspace]

[dependencies]
base64 = "0.22"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }

[dev-dependencies]
png = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "deny"
