[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Repository maintenance commands for artifact-mcp (cargo xtask)."

[dependencies]
aes-gcm = "0.11"
artifact-mcp = { path = ".." }
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time"] }
url = "2.5.8"
