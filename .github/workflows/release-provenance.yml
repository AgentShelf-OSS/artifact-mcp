name: Release

on:
  push:
    # GitHub filters are globs, not regular expressions; `prepare` enforces the exact shape.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to release (for example v1.7.2)
        required: true
        type: string

# Build and verify one candidate digest, then publish that same digest as the stable image and
# GitHub Release. Homelab backup, approval, and rollback checks belong to the deployment process.
concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify release input
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      created: ${{ steps.release.outputs.created }}
      image: ${{ steps.release.outputs.image }}
      schema_current: ${{ steps.release.outputs.schema_current }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - id: release
        name: Verify tag and version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME:-}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "A vMAJOR.MINOR.PATCH tag is required" >&2; exit 1;
          }
          git rev-parse --verify "refs/tags/$tag" >/dev/null
          [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]] || {
            echo "Release tags must be annotated" >&2; exit 1;
          }
          commit="$(git rev-parse "$tag^{commit}")"
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          [[ "$tag" == "v$version" ]] || {
            echo "Tag $tag does not match Cargo.toml version $version" >&2; exit 1;
          }
          package_version="$(node -p "require('./package.json').version")"
          [[ "$version" == "$package_version" ]] || {
            echo "Cargo.toml version $version does not match package.json version $package_version" >&2; exit 1;
          }
          schema_current="$(sed -nE 's/^pub const LATEST_SCHEMA_VERSION: i64 = ([0-9]+);/\1/p' src/persistence/migrations.rs)"
          [[ -n "$schema_current" ]] || { echo "Could not determine schema version" >&2; exit 1; }
          created="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/$tag")"
          created="$(date -u -d "$created" +%Y-%m-%dT%H:%M:%SZ)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "commit=$commit"
            echo "created=$created"
            echo "image=$image"
            echo "schema_current=$schema_current"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  verify-ci:
    name: Require successful CI for tagged commit
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify default-branch ancestry and CI result
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$COMMIT" "origin/$DEFAULT_BRANCH" || {
            echo "Tagged commit $COMMIT is not on $DEFAULT_BRANCH" >&2; exit 1;
          }
          successful_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          [[ "$successful_runs" -gt 0 ]] || {
            echo "No successful CI push run exists for $COMMIT" >&2; exit 1;
          }

  candidate:
    name: Build, test, scan, and attest candidate
    needs: [prepare, verify-ci]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      binary_attestation: ${{ steps.attest_binary.outputs.attestation-url }}
      image_attestation: ${{ steps.attest_image.outputs.attestation-url }}
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Generate deterministic source SBOM
        run: |
          mkdir release
          node scripts/release/generate-source-sbom.mjs \
            --out release/source.spdx.json \
            --commit '${{ needs.prepare.outputs.commit }}' \
            --version '${{ needs.prepare.outputs.version }}' \
            --created '${{ needs.prepare.outputs.created }}' \
            --repository '${{ github.repository }}'
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.rust
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ needs.prepare.outputs.commit }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.commit }}
            CREATED=${{ needs.prepare.outputs.created }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Pull and exercise the exact candidate digest against frozen fixtures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          cleanup() { docker rm --force artifact-mcp-release-candidate >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name artifact-mcp-release-candidate \
            --tmpfs /data-rust:rw,nosuid,nodev,noexec,size=64m,mode=1777,uid=65532,gid=65532 \
            --env AUDIT_LEDGER_HMAC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env WEBHOOK_ENC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --publish 127.0.0.1:3480:3480 "$IMAGE@$DIGEST"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3480/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --show-error http://127.0.0.1:3480/health >/dev/null; then
            docker logs artifact-mcp-release-candidate >&2 || true
            exit 1
          fi
          node scripts/release/verify-historical-fixtures-in-image.mjs \
            "$IMAGE@$DIGEST" release/historical-fixture-preflight.json
          container="$(docker create "$IMAGE@$DIGEST")"
          docker cp "$container:/artifact-mcp" release/artifact-mcp
          docker rm "$container" >/dev/null
      - name: Generate SPDX image SBOM for exact candidate digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: release/image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Enforce the high/critical vulnerability policy
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
      - name: Write candidate checksums
        run: |
          cd release
          sha256sum artifact-mcp source.spdx.json image.spdx.json historical-fixture-preflight.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - id: attest_binary
        name: Attest the released native binary
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/artifact-mcp
      - id: attest_image
        name: Attest the released OCI image digest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ needs.prepare.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified digest and release evidence
    needs: [prepare, candidate]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.prepare.outputs.tag }}
          path: release
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify inputs and candidate artifacts
        env:
          DIGEST: ${{ needs.candidate.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ -f "docs/releases/$TAG.md" ]] || {
            echo "Missing docs/releases/$TAG.md migration notes" >&2; exit 1;
          }
          (cd release && sha256sum --check SHA256SUMS)
          docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null
          candidate_digest="$(docker buildx imagetools inspect "$IMAGE:candidate-${{ needs.prepare.outputs.commit }}" | awk '/^Digest:/ {print $2}')"
          [[ "$candidate_digest" == "$DIGEST" ]] || {
            echo "Candidate tag does not resolve to the attested digest" >&2; exit 1;
          }
          gh attestation verify release/artifact-mcp --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            existing="$(docker buildx imagetools inspect "$IMAGE:$TAG" | awk '/^Digest:/ {print $2}')"
            [[ "$existing" == "$DIGEST" ]] || {
              echo "Existing release image digest $existing does not match candidate $DIGEST" >&2; exit 1;
            }
          fi
      - name: Promote without rebuilding
        env:
          DIGEST: ${{ needs.candidate.outputs.image_digest }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          fi
          published="$(docker buildx imagetools inspect "$IMAGE:$TAG" | awk '/^Digest:/ {print $2}')"
          [[ "$published" == "$DIGEST" ]] || {
            echo "Published digest $published did not match verified candidate $DIGEST" >&2; exit 1;
          }
      - name: Generate and verify release manifest
        env:
          DIGEST: ${{ needs.candidate.outputs.image_digest }}
        run: |
          set -euo pipefail
          cd release
          cp "../docs/releases/$TAG.md" migration-notes.md
          node ../scripts/release/generate-manifest.mjs \
            --out release-manifest.json \
            --tag "$TAG" \
            --version '${{ needs.prepare.outputs.version }}' \
            --commit '${{ needs.prepare.outputs.commit }}' \
            --created '${{ needs.prepare.outputs.created }}' \
            --binary artifact-mcp \
            --image-ref "$IMAGE:$TAG" \
            --image-digest "$DIGEST" \
            --schema-min 0 \
            --schema-current '${{ needs.prepare.outputs.schema_current }}' \
            --schema-max '${{ needs.prepare.outputs.schema_current }}' \
            --source-sbom source.spdx.json \
            --image-sbom image.spdx.json \
            --migration-notes migration-notes.md \
            --fixture-preflight historical-fixture-preflight.json \
            --repository '${{ github.repository }}' \
            --binary-attestation '${{ needs.candidate.outputs.binary_attestation }}' \
            --image-attestation '${{ needs.candidate.outputs.image_attestation }}'
          node ../scripts/release/verify-manifest.mjs release-manifest.json
          sha256sum artifact-mcp source.spdx.json image.spdx.json historical-fixture-preflight.json migration-notes.md release-manifest.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - id: release_state
        name: Check existing release state
        run: |
          set -euo pipefail
          if release_json="$(gh release view "$TAG" --json isDraft,assets 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "false" ]]; then
              for asset in artifact-mcp SHA256SUMS release-manifest.json source.spdx.json \
                image.spdx.json historical-fixture-preflight.json migration-notes.md; do
                jq -e --arg asset "$asset" '.assets | map(.name) | index($asset) != null' \
                  <<<"$release_json" >/dev/null || {
                    echo "Published release $TAG is missing $asset" >&2; exit 1;
                  }
              done
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"
      - name: Create or update draft release evidence
        if: steps.release_state.outputs.published != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/artifact-mcp
            release/SHA256SUMS
            release/release-manifest.json
            release/source.spdx.json
            release/image.spdx.json
            release/historical-fixture-preflight.json
            release/migration-notes.md
      - name: Publish and lock release
        if: steps.release_state.outputs.published != 'true'
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
