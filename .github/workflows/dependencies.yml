name: Dependencies

on:
  push:
    branches: [main, master]
  pull_request:
  # New advisories are published without any change here, so check master every day as well.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  cargo-deny:
    # Fails on a RustSec advisory, a licence outside the allowlist, a wildcard version, or a
    # dependency from anywhere other than crates.io, in all three Cargo workspaces. Exceptions and
    # their reasons live in deny.toml.
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Download the pinned cargo-deny release
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      - run: cargo deny --manifest-path Cargo.toml --workspace --config deny.toml check advisories bans licenses sources
      - run: cargo deny --manifest-path preview-renderer/Cargo.toml --workspace --config deny.toml check advisories bans licenses sources
      - run: cargo deny --manifest-path browser-tests/Cargo.toml --workspace --config deny.toml check advisories bans licenses sources
