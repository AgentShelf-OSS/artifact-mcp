name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    # `cargo test` is the whole server gate: unit and native tests, the HTTP conformance replay
    # (tests/conformance), the derived MCP surface check (tests/mcp_surface), and the frozen
    # historical fixtures. Nothing here needs Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The MCP surface report compares against the change base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The release build has no features, so the `test-util` fakes are absent; lint it on its
      # own to catch imports and items only those fakes use.
      - name: Lint the release targets without features
        run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      # If cargo-nextest is ever adopted as the runner it does NOT execute doctests, and the
      # security::access compile_fail proofs live there — keep an explicit doc-test step.
      - run: cargo test --doc --locked
      # Rustdoc lints (broken or private intra-doc links, invalid HTML) only warn by default, so
      # a module split can break a link without failing any other step.
      - name: Build the docs with rustdoc warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Regenerate the reproducible historical fixtures and compare them with the committed ones
        run: cargo xtask historical-fixture --verify-against-committed
      - name: Report MCP surface paths changed since the change base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "$zero_sha" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          MCP_SURFACE_BASE="$base" cargo test --locked --test mcp_surface -- --nocapture

  image:
    # The release image is otherwise built only when a tag is released. Build it on every change,
    # and check that the binary carries cargo-auditable's dependency list, which the release SBOM
    # and vulnerability scan read.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: artifact-mcp:ci
      - name: Check the binary carries its dependency list
        run: |
          set -euo pipefail
          container="$(docker create artifact-mcp:ci)"
          docker cp "$container:/artifact-mcp" "$RUNNER_TEMP/artifact-mcp"
          docker rm "$container" >/dev/null
          readelf --section-headers "$RUNNER_TEMP/artifact-mcp" | grep -q '\.dep-v0' || {
            echo "artifact-mcp has no .dep-v0 section; build it with cargo auditable" >&2; exit 1;
          }

  preview-renderer:
    # The isolated HTML-to-PNG sidecar is its own Cargo workspace. Its tests drive the pinned Chrome
    # for Testing headless shell, so a missing browser is a failure (CI=1), not a skip.
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: preview-renderer
      - name: Download the pinned chrome-headless-shell from preview-renderer/Dockerfile
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^ARG CHROME_VERSION=(.+)$/\1/p' preview-renderer/Dockerfile)"
          sha256="$(sed -nE 's/^ARG CHROME_SHA256=(.+)$/\1/p' preview-renderer/Dockerfile)"
          [ -n "$version" ] && [ -n "$sha256" ]
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/chs.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chrome-headless-shell-linux64.zip"
          echo "${sha256}  $RUNNER_TEMP/chs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/chs.zip" -d "$RUNNER_TEMP"
          echo "CHROME_HEADLESS_SHELL=$RUNNER_TEMP/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Allow the unprivileged user namespaces that the CHROME_SANDBOX tests need
        # Ubuntu 24.04 restricts them through AppArmor. Without them the sandbox tests fail (CI=1).
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --net --fork true
      - run: cargo fmt --manifest-path preview-renderer/Cargo.toml --check
      - run: cargo clippy --manifest-path preview-renderer/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path preview-renderer/Cargo.toml --locked
      - name: Build the docs with rustdoc warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path preview-renderer/Cargo.toml --no-deps --locked

  browser:
    # Browser tests run in the pinned chrome-headless-shell, driven from Rust: the browser-asset
    # tests and the journeys against the Rust release binary (browser-tests/). Each journey run
    # has an isolated database, and teardown removes the synthetic organization and artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            browser-tests
      - run: cargo build --release --locked
      - name: Download the pinned chrome-headless-shell from preview-renderer/Dockerfile
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^ARG CHROME_VERSION=(.+)$/\1/p' preview-renderer/Dockerfile)"
          sha256="$(sed -nE 's/^ARG CHROME_SHA256=(.+)$/\1/p' preview-renderer/Dockerfile)"
          [ -n "$version" ] && [ -n "$sha256" ]
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/chs.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chrome-headless-shell-linux64.zip"
          echo "${sha256}  $RUNNER_TEMP/chs.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/chs.zip" -d "$RUNNER_TEMP"
          echo "CHROME_HEADLESS_SHELL=$RUNNER_TEMP/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
          echo "ARTIFACT_MCP_BIN=$GITHUB_WORKSPACE/target/release/artifact-mcp" >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path browser-tests/Cargo.toml --check
      - run: cargo clippy --manifest-path browser-tests/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path browser-tests/Cargo.toml --locked
      - name: Build the docs with rustdoc warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path browser-tests/Cargo.toml --no-deps --locked
