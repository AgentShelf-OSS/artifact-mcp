name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  conformance:
    # The language-neutral oracle is a hard two-runtime gate. A missing Rust binary is a failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: node conformance/runner.mjs --impl both

  rust:
    # Node IS required here, not incidental: the cross-runtime parity proofs drive the real
    # lib/*.js via `node -e`. Without REQUIRE_NODE_REFERENCE=1 those tests SKIP and report ok, so
    # the strongest guarantees in the suite would green-pass while testing nothing.
    runs-on: ubuntu-latest
    env:
      REQUIRE_NODE_REFERENCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # better-sqlite3 is a native module the parity drivers load from node_modules.
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      # If cargo-nextest is ever adopted as the runner it does NOT execute doctests, and the
      # security::access compile_fail proofs live there — keep an explicit doc-test step.
      - run: cargo test --doc --locked

  browser:
    # Real Chromium journeys run against both complete server packages. Each instance has an
    # isolated database, and global teardown removes the synthetic organization and artifacts.
    runs-on: ubuntu-latest
    needs: [test, conformance, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: npm --prefix playwright ci
      - run: npm --prefix playwright exec -- playwright install --with-deps chromium
      - name: Run Node and Rust browser parity
        env:
          PW_NODE_URL: http://127.0.0.1:3485
          PW_RUST_URL: http://127.0.0.1:3483
          PW_ADMIN_EMAIL: admin@example.test
          PW_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          PW_USE_BUNDLED_CHROMIUM: "1"
        run: |
          set -euo pipefail
          node_data="$(mktemp -d)"
          rust_data="$(mktemp -d)"
          node_log="$RUNNER_TEMP/artifact-mcp-node.log"
          rust_log="$RUNNER_TEMP/artifact-mcp-rust.log"

          env DATA_DIR="$node_data" PORT=3485 LISTEN_HOST=127.0.0.1 \
            TRUST_ACCESS_HEADERS=1 ADMIN_EMAILS="$PW_ADMIN_EMAIL" NODE_ENV=test \
            PUBLIC_BASE_URL="$PW_NODE_URL" PREVIEW_RENDERER_URL= \
            node server.js >"$node_log" 2>&1 &
          node_pid=$!

          env DATA_DIR="$rust_data" PORT=3483 LISTEN_HOST=127.0.0.1 \
            TRUST_ACCESS_HEADERS=1 ADMIN_EMAILS="$PW_ADMIN_EMAIL" NODE_ENV=test \
            PUBLIC_BASE_URL="$PW_RUST_URL" PREVIEW_RENDERER_URL= \
            target/release/artifact-mcp >"$rust_log" 2>&1 &
          rust_pid=$!

          cleanup() {
            kill "$node_pid" "$rust_pid" 2>/dev/null || true
            wait "$node_pid" "$rust_pid" 2>/dev/null || true
            rm -rf "$node_data" "$rust_data"
          }
          trap cleanup EXIT

          for url in "$PW_NODE_URL" "$PW_RUST_URL"; do
            ready=0
            for _ in $(seq 1 60); do
              if curl --fail --silent "$url/health" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$node_log" "$rust_log"
              exit 1
            fi
          done

          if ! (cd playwright && npm test); then
            cat "$node_log" "$rust_log"
            exit 1
          fi
